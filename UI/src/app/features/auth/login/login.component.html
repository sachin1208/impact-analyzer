<div class="login-container">
  <div class="login-card">
    <h1>Impact Analyzer</h1>
    <h2>Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          id="username"
          type="text" 
          formControlName="username" 
          class="form-control"
          placeholder="Enter username">
        <div *ngIf="submitted && f['username'].errors" class="error">
          <div *ngIf="f['username'].errors['required']">Username is required</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          type="password" 
          formControlName="password" 
          class="form-control"
          placeholder="Enter password">
        <div *ngIf="submitted && f['password'].errors" class="error">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <button [disabled]="loading" class="btn-submit" type="submit">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="demo-credentials">
      <h3>Demo Credentials</h3>
      <p><strong>Admin:</strong> admin / Admin&#64;123</p>
+      <p><strong>Developer:</strong> developer / Dev&#64;123</p>
+      <p><strong>Viewer:</strong> viewer / View&#64;123</p>
    </div>
  </div>
</div>
